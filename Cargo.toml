[package]
name = "mistserver-rs"
version = "0.2.0"
edition = "2024"

[dependencies]
md5 = "0.8.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_tuple = "1.1.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"

[lib]
doctest = false

[dev-dependencies]
mockito = "1.7.2"
tracing-subscriber = "0.3"


[features]
testing = []

# --- Development phase only

[lints.rust]
unused_variables = "allow"
dead_code = "allow"
